[package]
name = "webtui"
version = "0.1.0"
edition = "2021"
description = "Terminal web browser — real Chrome renders off-screen, ratatui draws the structure"

[dependencies]
anyhow = "1"
chromiumoxide = "0.9"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
